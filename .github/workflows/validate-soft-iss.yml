name: Validate Soft Inno Setup script

on:
  push:
    paths:
      - "Soft.iss"
      - "MySoft_Structure_UTF8.txt"
      - ".github/workflows/validate-soft-iss.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found."
          }

      - name: Create compile fixtures and compile
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "SoftCompileFixture"
          $sourceRoot = Join-Path $root "Софт (исходники)"
          $portableRoot = Join-Path $sourceRoot "Софт-Portable\Программы без архива-Portable"
          $setupRoot = Join-Path $sourceRoot "Софт-SetUp\Программы без архива-SetUp"
          $portableArchiveRoot = Join-Path $sourceRoot "Софт-Portable"
          $setupArchiveRoot = Join-Path $sourceRoot "Софт-SetUp"
          New-Item -ItemType Directory -Force -Path $root, (Join-Path $root "Output") | Out-Null

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon("$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe")
          $iconStream = [System.IO.File]::Create((Join-Path $root "app.ico"))
          $icon.Save($iconStream)
          $iconStream.Dispose()

          foreach ($line in Get-Content "Soft.iss") {
            if ($line -match '^Source: "([^"]+)"') {
              $source = $Matches[1]
              $source = $source.Replace("{#PortableRoot}", $portableRoot)
              $source = $source.Replace("{#SetupRoot}", $setupRoot)
              $source = $source.Replace("{#PortableArchiveRoot}", $portableArchiveRoot)
              $source = $source.Replace("{#SetupArchiveRoot}", $setupArchiveRoot)
              if ($source.EndsWith("\\*")) {
                $directory = $source.Substring(0, $source.Length - 2)
                New-Item -ItemType Directory -Force -Path $directory | Out-Null
                Set-Content -Path (Join-Path $directory "_compile_check.txt") -Value "compile fixture"
              }
              else {
                $directory = Split-Path -Parent $source
                New-Item -ItemType Directory -Force -Path $directory | Out-Null
                Set-Content -Path $source -Value "compile fixture"
              }
            }
          }

          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DMySoftRoot=`"$root`"" "Soft.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path (Join-Path $root "Output\Установщик Soft.exe"))) {
            throw "Expected installer output was not created."
          }
