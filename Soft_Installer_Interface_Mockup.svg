<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset="1" stop-color="#101a25"/></linearGradient></defs>
<rect width="1600" height="1180" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="55" y="58" font-size="28" font-weight="700" fill="#f3f6fa">SOFT / УСТАНОВЩИК</text>
<text x="55" y="91" font-size="15" fill="#9aabbd">Отдельный выбор режима: каталог программ или готовые архивы</text>
<path d="M55 115H1545" stroke="#34485c"/>
<g transform="translate(55 145)">
<rect width="720" height="430" rx="8" fill="#17212d" stroke="#465a70"/>
<rect width="720" height="48" rx="8" fill="#202d3b"/>
<text x="24" y="30" font-size="15" fill="#edf3f8">Установка - Софт</text>
<text x="30" y="100" font-size="25" font-weight="600" fill="#f4f7fb">Выберите папку установки</text>
<text x="30" y="133" font-size="15" fill="#b5c2cf">Укажите папку, в которой будут размещены выбранные программы или архивы.</text>
<text x="30" y="195" font-size="14" fill="#e5edf5">Папка установки:</text>
<rect x="30" y="211" width="520" height="38" rx="3" fill="#101923" stroke="#52667b"/>
<text x="45" y="236" font-size="15" fill="#f1f5f9">C:\</text>
<rect x="562" y="211" width="126" height="38" rx="3" fill="#29394a" stroke="#63778d"/>
<text x="625" y="235" text-anchor="middle" font-size="14" fill="#f1f5f9">Обзор...</text>
</g>
<g transform="translate(825 145)">
<rect width="720" height="430" rx="8" fill="#17212d" stroke="#465a70"/>
<rect width="720" height="48" rx="8" fill="#202d3b"/>
<text x="24" y="30" font-size="15" fill="#edf3f8">Установка - Софт</text>
<text x="30" y="100" font-size="25" font-weight="600" fill="#f4f7fb">Выбор способа установки</text>
<text x="30" y="133" font-size="15" fill="#b5c2cf">Выберите один из двух вариантов:</text>
<circle cx="55" cy="195" r="10" fill="none" stroke="#8da1b6" stroke-width="2"/>
<circle cx="55" cy="195" r="5" fill="#48a9e5"/>
<text x="82" y="201" font-size="17" fill="#f1f5f9">Выбрать программы из каталога</text>
<circle cx="55" cy="252" r="10" fill="none" stroke="#8da1b6" stroke-width="2"/>
<text x="82" y="258" font-size="17" fill="#f1f5f9">Выбрать готовые архивы</text>
<text x="30" y="335" font-size="14" fill="#9aabbd">После нажатия «Далее» откроется только выбранный раздел.</text>
</g>
<g transform="translate(55 625)">
<rect width="720" height="430" rx="8" fill="#17212d" stroke="#465a70"/>
<rect width="720" height="48" rx="8" fill="#202d3b"/>
<text x="24" y="30" font-size="15" fill="#edf3f8">Установка - Софт</text>
<text x="30" y="100" font-size="25" font-weight="600" fill="#f4f7fb">Выбор программ</text>
<text x="30" y="133" font-size="15" fill="#b5c2cf">Отметьте нужные пункты в каталоге. Архивы здесь не отображаются.</text>
<rect x="30" y="160" width="660" height="220" rx="4" fill="#111a24" stroke="#465a70"/>
<g font-size="15" fill="#e8eef4">
<text x="52" y="193" font-weight="600">▾ Портативные программы</text>
<text x="75" y="225">□ Adobe Acrobat Pro</text>
<text x="75" y="253">□ Blender</text>
<text x="52" y="291" font-weight="600">▾ Установщики программ</text>
<text x="75" y="323">□ Visual Studio</text>
<text x="75" y="351">□ Visual Studio Code</text>
<text x="75" y="379">▸ Браузеры</text>
</g>
<rect x="75" y="390" width="115" height="25" rx="3" fill="#29394a" stroke="#63778d"/>
<text x="132" y="407" text-anchor="middle" font-size="12" fill="#f1f5f9">Развернуть</text>
</g>
<g transform="translate(825 625)">
<rect width="720" height="430" rx="8" fill="#17212d" stroke="#465a70"/>
<rect width="720" height="48" rx="8" fill="#202d3b"/>
<text x="24" y="30" font-size="15" fill="#edf3f8">Установка - Софт</text>
<text x="30" y="100" font-size="25" font-weight="600" fill="#f4f7fb">Выбор архивов</text>
<text x="30" y="133" font-size="15" fill="#b5c2cf">Отметьте один или оба готовых архива.</text>
<rect x="30" y="160" width="660" height="220" rx="4" fill="#111a24" stroke="#465a70"/>
<g font-size="16" fill="#e8eef4">
<text x="55" y="205">□ Архив с портативными программами</text>
<text x="55" y="252">□ Архив с установочными версиями программ</text>
</g>
</g>
<text x="55" y="1120" font-size="13" fill="#8396aa">Концепция последовательности страниц. Окончательный вид элементов формируется Inno Setup.</text>
</g></svg>